```yaml
name: A workflow for my Hello World App

on: push

jobs:
  build:
    name: Hello world action
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup MongoDB
        run: |
          docker pull mongo
          docker run -d --name mongo-dbserver -p 27017:27017 mongo
          sleep 15
          docker ps -a
          docker logs mongo-dbserver

      - name: Test MongoDB
        run: |
          docker exec mongo-dbserver mongosh \
            --eval "db.runCommand({ ping: 1 })"

      - name: Build with Maven
        run: mvn clean package

      - name: Check target
        run: ls -la target

      - name: Build Docker image
        run: docker build -t se_methods .

      - name: Run Java container
        run: |
          docker run \
            --network container:mongo-dbserver \
            --name devopscontainer \
            se_methods

      - name: View logs
        if: always()
        run: |
          docker ps -a
          echo "===== MongoDB logs ====="
          docker logs mongo-dbserver 2>&1 || true
          echo "===== Java container logs ====="
          docker logs devopscontainer 2>&1 || true
```
