name: A workflow for my Hello World App

on: push

jobs:
  build:
    name: Hello world action
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup MongoDB
        run: |
          docker pull mongo

          docker run -d \
            --name mongo-dbserver \
            -p 27017:27017 \
            mongo

          sleep 15

          echo "================================"
          echo "DOCKER CONTAINERS"
          echo "================================"
          docker ps -a

          echo "================================"
          echo "MONGODB LOGS"
          echo "================================"
          docker logs mongo-dbserver 2>&1 || true

      - name: Check MongoDB Status
        run: |
          echo "================================"
          echo "MONGODB STATUS"
          echo "================================"

          docker inspect mongo-dbserver \
            --format='Status={{.State.Status}} ExitCode={{.State.ExitCode}} Error={{.State.Error}}'

          echo "================================"
          echo "MONGODB LOGS AGAIN"
          echo "================================"

          docker logs mongo-dbserver 2>&1 || true

      - name: Test MongoDB
        run: |
          if [ "$(docker inspect -f '{{.State.Running}}' mongo-dbserver)" != "true" ]; then
            echo "MongoDB is NOT running."
            echo "Stopping workflow so we can see the MongoDB error."
            exit 1
          fi

          docker exec mongo-dbserver mongosh \
            --eval "db.runCommand({ ping: 1 })"

      - name: Build with Maven
        run: mvn clean package

      - name: Check target
        run: |
          echo "================================"
          echo "TARGET FOLDER"
          echo "================================"
          ls -la target

      - name: Build Docker image
        run: docker build -t se_methods .

      - name: Run Java container
        run: |
          docker run \
            --network container:mongo-dbserver \
            --name devopscontainer \
            se_methods

      - name: View logs
        if: always()
        run: |
          echo "================================"
          echo "ALL CONTAINERS"
          echo "================================"
          docker ps -a

          echo "================================"
          echo "MONGODB LOGS"
          echo "================================"
          docker logs mongo-dbserver 2>&1 || true

          echo "================================"
          echo "JAVA LOGS"
          echo "================================"
          docker logs devopscontainer 2>&1 || true
