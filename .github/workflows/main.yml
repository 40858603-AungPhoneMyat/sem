name: A workflow for my Hello World App

on: push

jobs:
  build:
    name: Hello world action
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Create Docker network
        run: |
          docker network create se-methods

      - name: Start MongoDB
        run: |
          docker pull mongo:latest

          docker run -d \
            --name mongo-dbserver \
            --network se-methods \
            -p 27017:27017 \
            mongo:latest

          echo "Waiting for MongoDB..."
          sleep 15

          docker ps -a

          echo "MongoDB logs:"
          docker logs mongo-dbserver

      - name: Test MongoDB
        run: |
          docker exec mongo-dbserver \
            mongosh --eval "db.runCommand({ ping: 1 })"

      - name: Build with Maven
        run: |
          mvn clean package

      - name: Check target
        run: |
          ls -la target

      - name: Build Docker image
        run: |
          docker build --no-cache -t se_methods:latest .

      - name: Run Java container
        run: |
          docker run \
            --network container:mongo-dbserver \
            --name devopscontainer \
            se_methods:latest

      - name: View logs
        if: always()
        run: |
          echo "===== Docker containers ====="
          docker ps -a

          echo "===== MongoDB logs ====="
          docker logs mongo-dbserver 2>&1 || true

          echo "===== Java logs ====="
          docker logs devopscontainer 2>&1 || true
