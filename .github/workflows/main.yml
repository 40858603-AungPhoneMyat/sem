name: A workflow for my Hello World App

on: push

jobs:
  build:
    name: Hello world action
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Create Docker network
        run: |
          docker network create se-methods

      - name: Start MongoDB
        run: |
          docker pull mongo:8.0

          docker run -d \
            --name mongo-dbserver \
            --network se-methods \
            -p 27017:27017 \
            -e GLIBC_TUNABLES=glibc.pthread.rseq=1 \
            mongo:8.0

          echo "Waiting for MongoDB..."

          for i in {1..30}; do

            if docker exec mongo-dbserver \
              mongosh --quiet \
              --eval "db.runCommand({ ping: 1 }).ok" 2>/dev/null | grep -q "1"; then

              echo "MongoDB is ready!"
              break

            fi

            if [ "$(docker inspect -f '{{.State.Running}}' mongo-dbserver 2>/dev/null)" != "true" ]; then

              echo "MongoDB container stopped!"

              echo "===== MongoDB logs ====="
              docker logs mongo-dbserver 2>&1 || true

              exit 1

            fi

            echo "MongoDB not ready yet... attempt $i/30"
            sleep 2

          done

      - name: Test MongoDB
        run: |
          docker exec mongo-dbserver \
            mongosh --eval "db.runCommand({ ping: 1 })"

      - name: Build with Maven
        run: |
          mvn clean package

      - name: Check target
        run: |
          echo "===== TARGET FOLDER ====="
          ls -la target

      - name: Build Docker image
        run: |
          docker build --no-cache -t se_methods:latest .

      - name: Run Java container
        run: |
          docker run \
            --network container:mongo-dbserver \
            --name devopscontainer \
            se_methods:latest

      - name: View logs
        if: always()
        run: |
          echo "===== ALL CONTAINERS ====="
          docker ps -a

          echo "===== MONGODB LOGS ====="
          docker logs mongo-dbserver 2>&1 || true

          echo "===== JAVA LOGS ====="
          docker logs devopscontainer 2>&1 || true
