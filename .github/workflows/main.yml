name: A workflow for my Hello World App

on: push

jobs:
  build:
    name: Hello world action
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup network
        run: |
          docker network create se-methods
          docker pull mongo
          docker run -d --name mongo-dbserver --network se-methods --network-alias mongo-dbserver mongo
          sleep 10

      - name: Check MongoDB
        run: |
          docker ps
          docker network inspect se-methods

      - name: Test MongoDB DNS
        run: |
          docker run --rm --network se-methods busybox nslookup mongo-dbserver

      - name: Build with Maven
        run: mvn clean package

      - name: Check target
        run: ls -la target

      - name: Build Docker image
        run: docker build -t se_methods .

      - name: Run image
        run: docker run --network se-methods --name devopscontainer se_methods

      - name: View logs
        if: always()
        run: docker logs devopscontainer
